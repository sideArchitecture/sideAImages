name: Generate and Commit Manifest

on:
  push:
    branches:
      - ng
permissions:
  contents: write
jobs:
  generate-manifest:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run manifest generation script
        run: node scripts/generateManifests.js

      - name: Commit and push updated manifest if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add images/projects/manifest.json
          git add images/projects/**/manifest.json

          if ! git diff --cached --quiet; then
            git commit -m "🔄 Auto-update manifest after push to ng"
            git push
          else
            echo "✅ No manifest changes detected. Skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
